version: 3

# Per-route model-hosting backends. `type` selects the adapter:
#   omlx   - oMLX (OpenAI-compatible chat + /admin residency API)
#   openai - any generic OpenAI-compatible server (MLX mlx_lm.server,
#            llama.cpp llama-server, Ollama, LM Studio); no runtime residency
# Env overrides: OMLX_UPSTREAM (default upstream), OMLX_API_KEY, and
# MOE_UPSTREAM / DENSE_UPSTREAM (per-route upstream).
backends:
  moe:
    type: omlx
    upstream: http://127.0.0.1:8000
  dense:
    type: omlx
    upstream: http://127.0.0.1:8000

routes:
  moe:
    model: mlx-community--Qwen3.6-35B-A3B-6bit
    description: >-
      Qwen MoE workhorse for structured output, tool use, fitness and data analysis,
      summarization, general reasoning, research synthesis, iterative agent work,
      and routine through moderately complex coding, debugging, and feature work.
    capabilities:
      context_window: 131072
      max_output: 32768
      vision: false
  dense:
    model: scottlowry--Qwen3.8-27B-oQ6e-mtp
    description: >-
      High-quality specialist for substantial application or agent builds,
      repository-wide code review, architecture redesign, complex cross-module
      implementation, difficult concurrency or security debugging, and demanding
      code generation where quality is more important than latency.
    capabilities:
      context_window: 131072
      max_output: 32768
      vision: false

routing:
  fallback_route: moe
